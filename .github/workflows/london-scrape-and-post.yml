name: London - Scrape & Post

on:
  workflow_dispatch:
  schedule:
    # Refresh cinema data and sync the website; Instagram accounts are being deleted.
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'

permissions:
  contents: write
  issues: write

jobs:
  scrape-and-post:
    runs-on: ubuntu-latest
    # Normal runs take ~10 minutes. Same guard as Tokyo and Taipei, which hung for
    # an hour in September 2026 and killed the runner instead of failing.
    timeout-minutes: 40

    defaults:
      run:
        working-directory: ./london

    env:
      TZ: Europe/London
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: Run Scraper
        run: python main_scraper.py
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Validate Showtime Data
        run: |
          python - <<'PY'
          import json
          import re
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          with open('data/showtimes.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          today = datetime.now(ZoneInfo('Europe/London')).date().isoformat()
          todays_rows = [row for row in data if row.get('date_text') == today]
          unique_films = {
              row.get('tmdb_id') or re.sub(r'\W+', '', str(row.get('movie_title') or '')).lower()
              for row in todays_rows
          }
          unique_films.discard('')

          print(f"✅ Total showings: {len(data)}")
          print(f"✅ Today's showings ({today}): {len(todays_rows)}")
          print(f"✅ Today's unique films: {len(unique_films)}")

          if len(todays_rows) < 100:
              print(f"❌ Only {len(todays_rows)} showings found for today; expected 100+.")
              sys.exit(1)
          if len(unique_films) < 9:
              print(f"❌ Only {len(unique_films)} unique films found for today; expected at least 9.")
              sys.exit(1)
          PY

      - name: Commit & Push Data (Cinema Scrapers Repo)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Save refreshed cinema data.
          git add data/*.json

          # Commit locally
          git commit -m "Auto-Update London: data content" || echo "No changes to commit"

          # Stash any unstaged changes to prevent rebase failure
          git stash --include-untracked || true

          # FIX: Rebase to handle race conditions (if repo updated while running)
          git pull --rebase -X theirs origin main
          git stash drop || true

          # Push
          git push

      - name: Sync Data to Website1 Repo
        run: |
          if [ -z "$WEBSITE1_SYNC_TOKEN" ]; then
            echo "WEBSITE1_SYNC_TOKEN is not configured; skipping website1 sync."
            exit 0
          fi
          cd /tmp
          git clone https://github.com/jakobng/website1.git website1-sync
          cd website1-sync
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${WEBSITE1_SYNC_TOKEN}@github.com/jakobng/website1.git"

          # Copy showtimes.json to website1
          cp "$GITHUB_WORKSPACE/london/data/showtimes.json" london-cinema-scrapers/data/showtimes.json

          # Commit if there are changes
          git add london-cinema-scrapers/data/showtimes.json
          git commit -m "Auto-Update: London cinema showtimes sync from cinema-scrapers" || echo "No changes to commit"

          # Push with rebase to handle race conditions
          git pull --rebase -X theirs origin main
          git push
        env:
          WEBSITE1_SYNC_TOKEN: ${{ secrets.WEBSITE1_SYNC_TOKEN }}

      # Failure details stay in Actions and auto-fix issues; email alerts disabled at Leo's request.
      - name: Create Auto-Fix Issue
        if: failure()
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/create_autofix_issue.sh" \
            london \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${{ github.workflow }}" \
            "${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}
