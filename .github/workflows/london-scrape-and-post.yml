name: London - Scrape & Post

on:
  workflow_dispatch:
    inputs:
      post_type:
        description: 'Post Type'
        required: true
        default: 'cinema'
        type: choice
        options:
        - cinema
        - movie
        - data
  schedule:
    # We run at 6, 7, and 8 AM UTC to ensure we hit 7 AM and 8 AM local London time regardless of BST/GMT
    # GMT (Winter): 7 AM UTC is 7 AM local, 8 AM UTC is 8 AM local.
    # BST (Summer): 6 AM UTC is 7 AM local, 7 AM UTC is 8 AM local.
    # 7 AM local refreshes data daily and creates the expensive cinema collage only on Mondays.
    # 8 AM local refreshes data again before posting the movie spotlight.
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'

permissions:
  contents: write
  issues: write

jobs:
  scrape-and-post:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./london

    env:
      TZ: Europe/London
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_RECIPIENT_EMAIL: ${{ secrets.ALERT_RECIPIENT_EMAIL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          sudo apt-get install -y fonts-noto-cjk

      # --- LOGIC: DETERMINE MODE & SCRAPER STATUS ---
      - name: Determine Run Mode
        id: mode
        run: |
          # Default values
          TYPE="none"
          SCRAPE="false"
          
          # Check if triggered by Schedule or Manual
          if [ "${{ github.event_name }}" == "schedule" ]; then
            schedule="${{ github.event.schedule }}"
            echo "Schedule: $schedule"
            scheduled_utc_hour=$(printf '%s\n' "$schedule" | awk '{print $2}')
            scheduled_london_hour=$(SCHEDULED_UTC_HOUR="$scheduled_utc_hour" python - <<'PY'
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          import os

          hour = int(os.environ["SCHEDULED_UTC_HOUR"])
          today_utc = datetime.now(timezone.utc).date()
          scheduled_utc = datetime(today_utc.year, today_utc.month, today_utc.day, hour, tzinfo=timezone.utc)
          print(scheduled_utc.astimezone(ZoneInfo("Europe/London")).strftime("%H"))
          PY
          )
            echo "Scheduled London Hour: $scheduled_london_hour"
            
            # 7 AM local -> scrape daily; cinema collage only on Mondays.
            if [ "$scheduled_london_hour" == "07" ]; then
              SCRAPE="true"
              day_of_week=$(date +%u)
              if [ "$day_of_week" == "1" ]; then
                TYPE="cinema"
              else
                TYPE="data"
              fi
            # 8 AM local -> scrape again, then Movie Post
            elif [ "$scheduled_london_hour" == "08" ]; then
              TYPE="movie"
              SCRAPE="true"
            fi
            
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TYPE="${{ inputs.post_type }}"
            SCRAPE="true"
          fi
          
          echo "Selected Type: $TYPE"
          echo "Run Scraper: $SCRAPE"
          
          # Output variables for next steps
          echo "post_type=$TYPE" >> $GITHUB_OUTPUT
          echo "run_scraper=$SCRAPE" >> $GITHUB_OUTPUT

      # Exit if no action needed (for the extra hour in the cron schedule)
      - name: Check if action needed
        if: steps.mode.outputs.post_type == 'none'
        run: |
          echo "No action scheduled for this hour. Exiting."
          exit 0

      # --- STEP 1: SCRAPE (CONDITIONAL) ---
      - name: Run Scraper
        if: steps.mode.outputs.run_scraper == 'true'
        run: python main_scraper.py
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_RECIPIENT_EMAIL: ${{ secrets.ALERT_RECIPIENT_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Validate Showtime Data
        if: steps.mode.outputs.run_scraper == 'true'
        run: |
          python - <<'PY'
          import json
          import re
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          with open('data/showtimes.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          today = datetime.now(ZoneInfo('Europe/London')).date().isoformat()
          todays_rows = [row for row in data if row.get('date_text') == today]
          unique_films = {
              row.get('tmdb_id') or re.sub(r'\W+', '', str(row.get('movie_title') or '')).lower()
              for row in todays_rows
          }
          unique_films.discard('')

          print(f"✅ Total showings: {len(data)}")
          print(f"✅ Today's showings ({today}): {len(todays_rows)}")
          print(f"✅ Today's unique films: {len(unique_films)}")

          if len(todays_rows) < 100:
              print(f"❌ Only {len(todays_rows)} showings found for today; expected 100+.")
              sys.exit(1)
          if len(unique_films) < 9:
              print(f"❌ Only {len(unique_films)} unique films found for today; expected at least 9.")
              sys.exit(1)
          PY

      # --- STEP 2: GENERATE CONTENT (SPLIT) ---

      # If CINEMA mode -> Use generate_post.py
      - name: Generate Cinema Post (V1)
        if: steps.mode.outputs.post_type == 'cinema'
        run: python generate_post.py
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # If MOVIE mode -> Use generate_post2.py
      - name: Generate Movie Post (V2)
        if: steps.mode.outputs.post_type == 'movie'
        run: python generate_post2.py
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # --- STEP 3: SAVE DATA ---
      - name: Commit & Push Data (Cinema Scrapers Repo)
        id: commit_data
        if: steps.mode.outputs.post_type != 'none'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Add JSON data and new Images
          git add data/*.json ig_posts/*.png ig_posts/*.txt

          # Commit locally
          git commit -m "Auto-Update London: ${{ steps.mode.outputs.post_type }} content" || echo "No changes to commit"

          # Stash any unstaged changes to prevent rebase failure
          git stash --include-untracked || true

          # FIX: Rebase to handle race conditions (if repo updated while running)
          git pull --rebase -X theirs origin main
          git stash drop || true

          # Push
          git push
          echo "image_host_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Sync Data to Website1 Repo
        if: steps.mode.outputs.post_type != 'none'
        run: |
          if [ -z "$WEBSITE1_SYNC_TOKEN" ]; then
            echo "WEBSITE1_SYNC_TOKEN is not configured; skipping website1 sync."
            exit 0
          fi
          cd /tmp
          git clone https://github.com/jakobng/website1.git website1-sync
          cd website1-sync
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${WEBSITE1_SYNC_TOKEN}@github.com/jakobng/website1.git"

          # Copy showtimes.json to website1
          cp "$GITHUB_WORKSPACE/london/data/showtimes.json" london-cinema-scrapers/data/showtimes.json

          # Commit if there are changes
          git add london-cinema-scrapers/data/showtimes.json
          git commit -m "Auto-Update: London cinema showtimes sync from cinema-scrapers" || echo "No changes to commit"

          # Push with rebase to handle race conditions
          git pull --rebase -X theirs origin main
          git push
        env:
          WEBSITE1_SYNC_TOKEN: ${{ secrets.WEBSITE1_SYNC_TOKEN }}

      # --- STEP 4: WAIT FOR GITHUB PAGES TO DEPLOY ---
      - name: Wait for GitHub Pages deployment
        if: steps.mode.outputs.post_type != 'data' && steps.mode.outputs.post_type != 'none'
        run: |
          echo "⏳ Waiting 90 seconds for GitHub Pages to deploy new images..."
          sleep 90
          echo "✅ Wait complete. Proceeding with upload."

      # --- STEP 5: UPLOAD TO INSTAGRAM ---
      - name: Upload to Instagram
        id: instagram_upload
        if: steps.mode.outputs.post_type != 'data' && steps.mode.outputs.post_type != 'none'
        run: python upload_to_instagram.py --type ${{ steps.mode.outputs.post_type }}
        env:
          IG_USER_ID: ${{ secrets.LONDON_IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.LONDON_IG_ACCESS_TOKEN }}
          PUBLIC_IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.commit_data.outputs.image_host_sha }}/london/ig_posts/

      # --- STEP 6: SEND FAILURE ALERT ---
      - name: Send Failure Alert Email
        if: failure() && steps.mode.outputs.post_type != 'none'
        run: |
          python -c "
          import smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          import os
          from datetime import datetime

          sender = os.environ['SMTP_EMAIL']
          password = os.environ['SMTP_PASSWORD']
          recipient = os.environ['ALERT_RECIPIENT_EMAIL']

          msg = MIMEMultipart()
          msg['From'] = sender
          msg['To'] = recipient
          msg['Subject'] = '🚨 London Cinema Scraper Workflow Failed'

          body = f'''
          The London cinema scraper workflow failed.

          Post Type: ${{ steps.mode.outputs.post_type }}
          Time: {datetime.now().strftime('%Y-%m-%d %H:%M:%S London')}

          Common causes:
          - Scraped data is stale or below the minimum daily film/showing threshold
          - Content generation refused to create an undersized carousel
          - Instagram access token expired or invalidated
          - Authentication error (check LONDON_IG_ACCESS_TOKEN secret)
          - API rate limit exceeded

          View full logs:
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          To fix expired token:
          1. Go to Facebook Graph API Explorer
          2. Generate a new long-lived access token
          3. Update LONDON_IG_ACCESS_TOKEN in repository secrets
          '''

          msg.attach(MIMEText(body, 'plain'))

          server = smtplib.SMTP('smtp.gmail.com', 587)
          server.starttls()
          server.login(sender, password)
          server.send_message(msg)
          server.quit()
          print('✅ Alert email sent successfully')
          "
        env:
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_RECIPIENT_EMAIL: ${{ secrets.ALERT_RECIPIENT_EMAIL }}

      - name: Create Auto-Fix Issue
        if: failure()
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/create_autofix_issue.sh" \
            london \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${{ github.workflow }}" \
            "${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}
