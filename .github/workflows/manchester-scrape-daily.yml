name: Manchester - Scrape & Post

on:
  workflow_dispatch:
  schedule:
    # Refresh cinema data and sync the website; Instagram accounts are being deleted.
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'

permissions:
  contents: write
  issues: write

jobs:
  scrape-and-post:
    runs-on: ubuntu-latest
    # Normal runs take ~8 minutes. Same guard as Tokyo and Taipei, which hung for
    # an hour in September 2026 and killed the runner instead of failing.
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ./manchester

    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set Timezone
        run: sudo timedatectl set-timezone Europe/London

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: Run Scraper
        run: python main_scraper.py
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Verify scraped data is fresh
        run: |
          python - <<'PY'
          import datetime as dt, json, sys
          rows = json.load(open("data/showtimes.json"))
          today = dt.date.today().isoformat()
          future = [r for r in rows if (r.get("date_text") or "") >= today]
          cinemas = sorted({r.get("cinema_name") for r in future})
          print(f"rows={len(rows)} future={len(future)} cinemas={len(cinemas)}")
          for c in cinemas:
              print("  ", c, sum(1 for r in future if r.get("cinema_name") == c))
          if not future:
              sys.exit("FATAL: showtimes.json contains no showings from today onward.")
          if len(cinemas) < 3:
              sys.exit(f"FATAL: only {len(cinemas)} cinema(s) have future showings.")
          PY

      - name: Commit & Push Data (Cinema Scrapers Repo)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add data/*.json
          git commit -m "Auto-Update: manchester data content" || echo "No changes to commit"

          git stash --include-untracked || true
          git pull --rebase -X theirs origin main
          git stash drop || true

          git push

      - name: Sync Data to Website1 Repo
        run: |
          if [ -z "$WEBSITE1_SYNC_TOKEN" ]; then
            echo "WEBSITE1_SYNC_TOKEN is not configured; skipping website1 sync."
            exit 0
          fi
          cd /tmp
          git clone https://github.com/jakobng/website1.git website1-sync
          cd website1-sync
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${WEBSITE1_SYNC_TOKEN}@github.com/jakobng/website1.git"

          # Copy showtimes.json to website1
          cp "$GITHUB_WORKSPACE/manchester/data/showtimes.json" manchester_cinema_scrapers/data/showtimes.json

          # Commit if there are changes
          git add manchester_cinema_scrapers/data/showtimes.json
          git commit -m "Auto-Update: Manchester cinema showtimes sync from cinema-scrapers" || echo "No changes to commit"

          # Push with rebase to handle race conditions
          git pull --rebase -X theirs origin main
          git push
        env:
          WEBSITE1_SYNC_TOKEN: ${{ secrets.WEBSITE1_SYNC_TOKEN }}

      # Failure details stay in Actions and auto-fix issues; email alerts disabled at Leo's request.
      - name: Create Auto-Fix Issue
        if: failure()
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/create_autofix_issue.sh" \
            manchester \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${{ github.workflow }}" \
            "${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}
