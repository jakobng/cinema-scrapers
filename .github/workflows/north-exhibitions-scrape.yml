name: North Art Exhibitions - Scrape

on:
  workflow_dispatch:
  schedule:
    # Run every 3 days at 7 AM UK
    - cron: '0 7 */3 * *'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./north

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set Timezone
        run: sudo timedatectl set-timezone Europe/London

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run Scraper
        run: python main_scraper.py
        env:
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_RECIPIENT_EMAIL: ${{ secrets.ALERT_RECIPIENT_EMAIL }}

      - name: Commit & Push Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add data/*.json
          git commit -m "Auto-Update: north art exhibitions scrape data" || echo "No changes to commit"
          git pull --rebase -X theirs origin main
          git push

      - name: Sync exhibitions JSON to website1
        working-directory: .
        run: |
          if [ -z "$WEBSITE1_SYNC_TOKEN" ]; then
            echo "WEBSITE1_SYNC_TOKEN is not configured; skipping website1 sync."
            exit 0
          fi

          cd /tmp
          git clone https://github.com/jakobng/website1.git website1-sync
          cd website1-sync
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${WEBSITE1_SYNC_TOKEN}@github.com/jakobng/website1.git"

          mkdir -p north-art-exhibitions/data
          cp "$GITHUB_WORKSPACE/north/data/exhibitions.json" north-art-exhibitions/data/exhibitions.json

          git add north-art-exhibitions/data/exhibitions.json
          git commit -m "Auto-Update: north art exhibitions sync from cinema-scrapers" || echo "No changes to commit"
          git pull --rebase -X theirs origin main
          git push
        env:
          WEBSITE1_SYNC_TOKEN: ${{ secrets.WEBSITE1_SYNC_TOKEN }}
