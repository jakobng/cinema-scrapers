name: Tokyo - Deploy cinematokyo.com

# Rebuilds the static cinematokyo.com site from the freshly-scraped showtimes and
# pushes it to the jakobng/cinematokyo Pages repo. Runs after each Tokyo scrape,
# and on demand. Isolated from the scrape/Instagram pipeline: a failure here cannot
# affect scraping, posting, or the website1 sync.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Tokyo - Scrape & Post"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-cinematokyo
  cancel-in-progress: false

jobs:
  deploy:
    # Deploy whenever the scrape FINISHES, not only when it reports success.
    #
    # On 2026-09-09 the Tokyo scrape committed 3,712 rows to main and the runner
    # then lost communication with GitHub during a later step, so the job was
    # marked failure. The old gate read that conclusion, skipped, and left
    # cinematokyo.com serving a build from the previous day even though the data
    # it needed was sitting on main.
    #
    # Deploying unconditionally is safe: this job checks out main and builds from
    # committed data, so it can only ever publish a complete commit. If the scrape
    # died before committing, the build is identical and the deploy step exits on
    # "No changes to deploy".
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (latest committed data)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test site template
        run: python -B -m unittest -v tokyo.tests.test_service_worker tokyo.tests.test_site_template_ui

      - name: Build static site
        run: python tokyo/build_site.py

      - name: Deploy to cinematokyo repo
        env:
          CINEMATOKYO_SYNC_TOKEN: ${{ secrets.WEBSITE1_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CINEMATOKYO_SYNC_TOKEN:-}" ]; then
            echo "::error::WEBSITE1_SYNC_TOKEN is not configured."; exit 1
          fi
          rm -rf /tmp/cinematokyo-deploy
          git clone --depth 1 \
            "https://x-access-token:${CINEMATOKYO_SYNC_TOKEN}@github.com/jakobng/cinematokyo.git" \
            /tmp/cinematokyo-deploy
          # Mirror the freshly built site into the Pages repo (keep its .git).
          rsync -a --delete --exclude='.git' \
            "${GITHUB_WORKSPACE}/tokyo/site_build/" /tmp/cinematokyo-deploy/
          cd /tmp/cinematokyo-deploy
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."; exit 0
          fi
          git commit -m "Auto-deploy cinematokyo.com ($(date -u +%Y-%m-%dT%H:%MZ))"
          if ! git push 2>/tmp/push.err; then
            cat /tmp/push.err
            if grep -qiE '403|permission|denied|not authorized' /tmp/push.err; then
              echo "::error::Push to jakobng/cinematokyo was denied — WEBSITE1_SYNC_TOKEN cannot reach that repo. Fix: use a classic token with 'repo' scope, or add the cinematokyo repo to the fine-grained token's repository access."
            fi
            exit 1
          fi
          echo "✅ Deployed to cinematokyo.com"
