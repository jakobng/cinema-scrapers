name: Tokyo - Published Listings Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '25 4,16 * * *'

permissions:
  contents: read

jobs:
  check-live-listings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check the public site's collection age and cinema coverage
        # Keep technical checks in GitHub; the two-day Codex check handles serious incidents.
        run: python tokyo/publication_health.py --live
