name: Auto-Fix Scrapers

# Polls for open auto-fix-candidate issues and attempts AI-powered fixes via DeepSeek.
# Runs every 30 minutes. Fixes that pass policy + syntax check are pushed directly to main.
# Posts a single weekly summary issue instead of per-fix PRs.
#
# Uses the existing DEEPSEEK_API_KEY secret — no new secrets needed.

on:
  schedule:
    - cron: '7,37 * * * *'   # every 30 min, offset from :00 and :30
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max issues to process'
        required: true
        default: '3'
        type: number
      dry_run:
        description: 'Dry run (no push)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: auto-fix
  cancel-in-progress: false

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.WEBSITE1_SYNC_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure git
        run: |
          git config --global user.name 'auto-fix-bot[bot]'
          git config --global user.email 'auto-fix-bot[bot]@users.noreply.github.com'

      - name: Run auto-fix bot
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/scraper_autofix_bot.py \
            --provider deepseek \
            --model deepseek-chat \
            --limit ${{ inputs.limit || '3' }} \
            --log-chars 40000 \
            --timeout 120 \
            --ci \
            --skip-health-monitor \
            --weekly-summary \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Report complete
        if: success()
        run: echo "Auto-fix bot completed. Check logs for details."
